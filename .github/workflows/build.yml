name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# 允许 action 创建/更新 Release 并上传 asset（免用户 PAT，用内置 GITHUB_TOKEN）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleDebug

      - name: Upload APK artifact (backup, needs auth)
        uses: actions/upload-artifact@v4
        with:
          name: covefit-shell-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to public Release (no-auth download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-debug
          name: covefit-shell debug (latest)
          files: app/build/outputs/apk/debug/*.apk
          overwrite: true
          body: |
            Auto-built debug APK from `main`.
            Download via the release asset below — no GitHub auth required:
            https://github.com/${{ github.repository }}/releases/download/apk-debug/app-debug.apk
