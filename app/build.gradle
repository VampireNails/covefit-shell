plugins {
    id 'com.android.application'
}

android {
    namespace 'com.covefit.shell'
    compileSdk 34

    defaultConfig {
        applicationId 'com.covefit.shell'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 仅用框架自带 android.webkit.WebView，无需额外依赖
}
