plugins {
    id 'com.android.application'
}

android {
    namespace 'com.covefit.shell'
    compileSdk 34

    defaultConfig {
        applicationId 'com.covefit.shell'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // androidx.webkit 提供公开、仅限本 App WebView 的 ProxyController（替代隐藏的 android.net.ProxyController）
    implementation 'androidx.webkit:webkit:1.11.0'
}
